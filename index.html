<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>上古仙侠武学卷轴</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* ===== 全局 ===== */
body{
  margin:0;
  font-family:"KaiTi","STKaiti","FangSong",serif;
  background:#0b100d;
  color:#f3ead7;
  overflow-x:hidden;
}

/* ===== 多层云雾 ===== */
.clouds::before,.clouds::after{
  content:"";
  position:fixed;
  inset:-20%;
  background:
    radial-gradient(circle at 20% 30%, rgba(255,255,255,.08), transparent 45%),
    radial-gradient(circle at 70% 60%, rgba(255,255,255,.06), transparent 50%),
    radial-gradient(circle at 50% 80%, rgba(255,255,255,.05), transparent 55%);
  animation:cloudMove 120s linear infinite;
  z-index:-3;
}
.clouds::after{
  animation-duration:200s;
  opacity:.6;
}
@keyframes cloudMove{
  from{transform:translateX(0);}to{transform:translateX(800px);} 
}

/* ===== 宣纸纹理 ===== */
.paper{
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 10% 20%, rgba(255,255,255,.03), transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(0,0,0,.15), transparent 45%),
    repeating-linear-gradient(0deg, rgba(255,255,255,.015) 0 1px, transparent 1px 4px);
  z-index:-2;
}

/* ===== 符文 ===== */
.rune{
  position:fixed;
  bottom:-10%;
  font-size:28px;
  color:rgba(255,215,128,.15);
  animation:rise 30s linear infinite;
  pointer-events:none;
}
@keyframes rise{
  from{transform:translateY(0);opacity:0;}20%{opacity:.6;}to{transform:translateY(-120vh);opacity:0;}
}

/* ===== 卷轴主体 ===== */
.scroll{
  max-width:900px;
  margin:80px auto;
  padding:70px 50px;
  background:linear-gradient(#2f2718,#1d170e);
  position:relative;
  box-shadow:0 0 60px rgba(255,200,120,.25), inset 0 0 60px rgba(0,0,0,.7);
  animation:unroll 2s ease-out forwards;
  transform-origin:top;
  overflow:hidden;
}

/* 木轴 */
.scroll::before,.scroll::after{
  content:"";
  position:absolute;
  left:-40px;right:-40px;
  height:36px;
  background:linear-gradient(90deg,#3a2b16,#7b5a2c,#3a2b16);
  box-shadow:inset 0 0 8px rgba(0,0,0,.6);
}
.scroll::before{top:0;}
.scroll::after{bottom:0;}

@keyframes unroll{
  from{max-height:0;opacity:0;}to{max-height:6000px;opacity:1;}
}

h1{
  text-align:center;
  font-size:36px;
  letter-spacing:10px;
  color:#f5d78c;
  text-shadow:0 0 10px rgba(255,220,150,.6);
  margin-bottom:50px;
}

.item{padding:14px 0;border-bottom:1px dashed rgba(255,255,255,.2);} 
.name{font-size:20px;color:#ffd27d;} 
.desc{font-size:14px;color:#e0d4b5;opacity:.85;margin-top:4px;} 

.footer{text-align:center;margin-top:50px;font-size:13px;opacity:.6;} 
</style>
</head>

<body>
<div class="clouds"></div>
<div class="paper"></div>

<div class="rune" style="left:10%;animation-delay:0s">道</div>
<div class="rune" style="left:30%;animation-delay:8s">玄</div>
<div class="rune" style="left:55%;animation-delay:15s">仙</div>
<div class="rune" style="left:75%;animation-delay:22s">劫</div>

<div class="scroll">
<h1>上古仙侠武学总录</h1>

<div class="item"><div class="name">太虚剑意</div><div class="desc">出处：道门秘典｜功效：以意化剑，破虚斩神</div></div>
<div class="item"><div class="name">九转玄功</div><div class="desc">出处：封神演义｜功效：肉身成圣，万劫不坏</div></div>
<div class="item"><div class="name">六道轮回拳</div><div class="desc">出处：佛门传承｜功效：拳镇六道，因果俱灭</div></div>
<div class="item"><div class="name">北冥吞天诀</div><div class="desc">出处：仙侠小说｜功效：吞噬真元，化为己用</div></div>
<div class="item"><div class="name">太上忘情录</div><div class="desc">出处：道藏残卷｜功效：断情绝念，道心澄明</div></div>

<script>
const list=["紫霄神雷诀","天罡伏魔印","万象归元经","玄黄不灭体","青冥御风术","星河倒卷法","太阴凝魄术","太阳焚天功","混元一气掌","八荒镇狱指","诛仙四剑意","乾坤倒转术","五行化龙诀","真武荡魔功","无相金身","幽冥摄魂术","白骨生肌法","九幽黄泉掌","凌霄破界斩","太清御剑录","玄冥寒狱诀","炎帝焚世经","苍穹裂空步","龙象般若功","天魔解体大法","万佛朝宗掌","太极阴阳轮","八极崩天劲","虚空遁形术","九霄风雷步","紫府养神诀","鸿蒙初判经","混沌开天斧意","阴阳生死印","法天象地","玄天御雷真诀","不动明王身","星辰淬体诀","天外飞仙","玄武护体诀","朱雀焚空印","白虎裂山爪","青龙化形术","太初真解","无量光明经","破妄天眼","万法归宗","周天星斗阵","血海无涯诀","玄阴九变","大罗金仙体","天人合一","道心种魔","星陨灭世指","真龙不灭血","天命观星术","太上感应篇"];
const c=document.currentScript.parentElement;
list.forEach(n=>{const d=document.createElement('div');d.className='item';d.innerHTML=`<div class="name">${n}</div><div class="desc">出处：上古仙侠典籍｜功效：玄妙非常，各有所长</div>`;c.appendChild(d);});
</script>

<div class="footer">※ 藏经阁夜读，慎防走火入魔 ※</div>
</div>
</body>
</html>
